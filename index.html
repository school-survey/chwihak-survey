<script>
/* 구글 밖(GitHub Pages)에서 열릴 때: google.script.run 을 흉내내어 Apps Script 의 doPost 로 보낸다.
   text/plain 으로 보내 사전 요청(preflight)이 없고, 쿠키를 보내지 않아 구글 계정(/u/N/) 문제가 생기지 않는다. */
const BACKEND = 'https://script.google.com/macros/s/AKfycby4liZ8wwuShl1IiAdTvP_rNpV8fuZG_i7PRVsRPAFtrTCWr62oWKSjrbSFQHfZojS_/exec';
(function () {
  if (window.google && window.google.script && window.google.script.run) return;
  const call = (fn, args) => fetch(BACKEND, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({fn: fn, args: args}), redirect: 'follow', credentials: 'omit', cache: 'no-store'})
    .then(r => r.text())
    .then(t => { let j; try { j = JSON.parse(t); } catch (e) { throw new Error('서버 응답을 읽지 못했습니다. 잠시 후 다시 시도해 주십시오.'); } if (j && j.ok) return j.result; throw new Error((j && j.error) || '서버 오류'); });
  const mk = () => { const o = { s: null, f: null };
    const px = new Proxy(o, { get(t, p) { if (p in t) return t[p]; return (...args) => { call(String(p), args).then(r => { if (o.s) o.s(r); }, e => { if (o.f) o.f(e); else console.error(e); }); }; } });
    o.withSuccessHandler = fn => { o.s = fn; return px; }; o.withFailureHandler = fn => { o.f = fn; return px; };
    return px; };
  window.google = { script: { run: new Proxy({}, { get(_, p) { return mk()[p]; } }) } };
})();
</script>

      const b = el('div', 'banner'); b.appendChild(document.createTextNode('[관리자 보기] ' + x.name + ' (' + x.id + ') — ' + (st.submitted ? '제출됨 ' + st.receipt : '작성 중') + ', 마지막 저장 ' + (st.savedAt || '—') + '  '));
      const back = el('button', 'sm', '목록으로'); back.addEventListener('click', () => { P.style.display = 'none'; A.style.display = ''; }); b.appendChild(back);
      P.insertBefore(b, P.firstChild); window.scrollTo(0, 0);
    })
    .withFailureHandler(err => alert(emsg(err)))
    .adminGet(TOKEN, x.id);
}
</script>
