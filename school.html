    b.dataset.k = key(name, inp.value, '입력') + (UNITS.includes(suf) ? '(' + suf + ')' : '');
    b.addEventListener('input', () => { if (b.value) { inp.checked = true; inp.dispatchEvent(new Event('change', {bubbles:true})); } });
    lab.appendChild(b);
    lab.appendChild(document.createTextNode((suf ? ' ' + suf : '') + ')' + after));
    lab.classList.add('long');
  } else {
    lab.appendChild(document.createTextNode(text));
    if (text.length > 22) lab.classList.add('long');
  }
  return lab;
}

function qid(q) { return SEC ? SEC + '-' + q.no.replace(/[.)]$/, '') : q.no.replace(/[.)]$/, ''); }

function renderQ(q) {
  const d = el('div', 'q');
  const id = q.no ? qid(q) : SEC;
  d.dataset.id = id;
  if (q.no || q.text) d.appendChild(el('div', 'qt', (q.no + ' ' + q.text).trim()));
  const g = q.g || {};
  const k = q.kind;
  const opts = q.opts && q.opts.length ? q.opts : (g.opts || []);
  if ((k === 'radio' || k === 'check') && q.zero) {
    return null;                                   // Ⅱ 보기: 표의 드롭다운에 다 들어 있음
  } else if (k === 'radio' || k === 'check') {
    const box = el('div', 'opts');
    const start = (q.zero && q.opts[0] === '해당 없음') ? 0 : 1;
    q.opts.forEach((o, i) => box.appendChild(optLabel(q, o, i, id, k === 'radio' ? 'radio' : 'checkbox', start)));
    box.dataset.group = id; box.dataset.type = k;
    if (k === 'check' && g.max) box.addEventListener('change', ev => { if (ev.target.type === 'checkbox' && ev.target.checked && box.querySelectorAll('input[type=checkbox]:checked').length > g.max) { ev.target.checked = false; alert(g.max + '개까지만 고를 수 있습니다.'); } });
    q.extra.forEach(e => { const ln = el('div', 'line'); ln.appendChild(fillLine(e, id, opts)); box.appendChild(ln); });
    d.appendChild(box);
  } else if (k === 'rank') {
    const box = el('div', 'opts');
    const ln = el('div', '');
    ['1순위', '2순위', '3순위'].forEach(r => { ln.appendChild(document.createTextNode(r + ' ')); ln.appendChild(select(key(id, r), q.opts)); ln.appendChild(document.createTextNode('   ')); });
    box.appendChild(ln); d.appendChild(box);
  } else if (k === 'fill') {
    const box = el('div', 'opts');
    q.extra.forEach(e => { const ln = el('div', 'line'); ln.appendChild(fillLine(e, id, opts, !!(g.opts && e.indexOf('번') >= 0))); box.appendChild(ln); });
    d.appendChild(box);
  } else if (k === 'text') {
    const box = el('div', 'opts'); const ta = el('textarea'); ta.dataset.k = id; box.appendChild(ta); d.appendChild(box);
  } else if (k === 'school') {
    const box = el('div', 'opts'); const L = S.schools || [];
    const s1 = el('select', 'bl wide'); s1.dataset.k = key(id, '교육청');
    const s2 = el('select', 'bl wide'); s2.dataset.k = key(id, '교육지원청');
    const s3 = el('select', 'bl wide'); s3.dataset.k = key(id, '학교');
    const other = el('input', 'bl wide'); other.type = 'text'; other.dataset.k = key(id, '학교 직접 입력'); other.placeholder = '학교명을 적어 주십시오'; other.style.display = 'none';
    s1.appendChild(new Option('— 시·도교육청 선택 —', ''));
    [...new Set(L.map(r => r[0]))].forEach(v => s1.appendChild(new Option(v, v)));
    s2.appendChild(new Option('— 교육지원청 선택 —', ''));
    const jis = []; L.forEach(r => { if (!jis.some(j => j[1] === r[1])) jis.push([r[0], r[1]]); });
    jis.forEach(j => { const o = new Option(j[1], j[1]); o.dataset.p = j[0]; s2.appendChild(o); });
    s3.appendChild(new Option('— 학교 선택 —', ''));
    L.forEach(r => { const o = new Option(r[3] + ' (' + r[2] + ')', r[3]); o.dataset.p = r[1]; s3.appendChild(o); });
    const no = new Option('목록에 없음(직접 입력)', '목록에 없음'); s3.appendChild(no);
    const filt = () => {
      [...s2.options].forEach(o => { if (!o.value) return; const on = !s1.value || o.dataset.p === s1.value; o.hidden = !on; o.disabled = !on; });
      [...s3.options].forEach(o => { if (!o.value || o.value === '목록에 없음') return; const on = !s2.value || o.dataset.p === s2.value; o.hidden = !on; o.disabled = !on; });
      other.style.display = s3.value === '목록에 없음' ? '' : 'none';
    };
    s1.addEventListener('change', () => { const o = s2.selectedOptions[0]; if (o && o.value && o.dataset.p !== s1.value) { s2.value = ''; s3.value = ''; } filt(); });
    s2.addEventListener('change', () => { const o = s3.selectedOptions[0]; if (o && o.value && o.value !== '목록에 없음' && o.dataset.p !== s2.value) s3.value = ''; const j = s2.selectedOptions[0]; if (j && j.dataset.p) s1.value = j.dataset.p; filt(); });
    s3.addEventListener('change', () => { const o = s3.selectedOptions[0]; if (o && o.dataset.p) { s2.value = o.dataset.p; const j = s2.selectedOptions[0]; if (j && j.dataset.p) s1.value = j.dataset.p; } filt(); });
    AFTER_RESTORE.push(filt);
    [['시·도교육청', s1], ['교육지원청', s2], ['학교', s3]].forEach(([lb, sel]) => { const ln = el('div', 'line'); ln.appendChild(document.createTextNode(lb + ' ')); ln.appendChild(sel); box.appendChild(ln); });
    const ln = el('div', 'line'); ln.appendChild(other); box.appendChild(ln);
    box.appendChild(el('div', 'note', '※ 학교를 먼저 고르면 시·도교육청·교육지원청이 자동으로 채워집니다. 표집 목록에 없으면 「목록에 없음」을 고르고 학교명을 적어 주십시오.'));
    d.appendChild(box);
  } else if (k === 'table') {
    d.appendChild(table(q, id, opts));
    q.extra.forEach(e => { const ln = el('div', 'line'); ln.appendChild(fillLine(e, id, opts)); d.appendChild(ln); });
  }
  // 「(N번으로 이동)」 → 이동 대상 문항 전까지 흐리게
  const jump = (q.opts || []).map(o => (o.match(/\((\d+)번으로 이동\)/) || [])[1]).find(x => x);
  if (jump) d.addEventListener('change', ev => {
    if (ev.target.name !== id) return;
    const sel = d.querySelector('input[name="' + id + '"]:checked');
    const off = !!(sel && /번으로 이동/.test(sel.parentNode.textContent));
    for (let n = d.nextElementSibling; n && n.classList.contains('q'); n = n.nextElementSibling) {
      if (n.dataset.id === SEC_OF[id] + '-' + jump) break;
      n.classList.toggle('off', off);
    }
  });
  SEC_OF[id] = SEC;
  return d;
}

function table(q, id, opts) {
  const tb = q.table, rows = tb.rows, head = tb.head;
  const w = el('div', 'tw'); const t = el('table'); w.appendChild(t);
  const hdr = rows[head - 1].map(c => (typeof c === 'string' ? c : (c && c.t) || '').replace(/\n/g, ''));
  const isMx = (q.g || {}).type === 'matrix', isLk = (q.g || {}).type === 'likert';
  if (isMx) t.className = 'mx';
  rows.forEach((r, ri) => {
    const tr = el('tr');
    const isHead = ri < head;
    let rowLabel = '';
    r.forEach((c, ci) => {
      if (c === null) return;
      const cell = el(isHead ? 'th' : 'td');
      const txt = typeof c === 'string' ? c : (c.t || '');
      if (typeof c === 'object' && c) { if (c.cs) cell.colSpan = c.cs; if (c.rs) cell.rowSpan = c.rs; }
      if (isHead) { cell.innerHTML = ''; txt.split('\n').forEach((s, i) => { if (i) cell.appendChild(el('br')); cell.appendChild(document.createTextNode(s)); }); tr.appendChild(cell); return; }
      const col = hdr[ci] || '';
      if (ci === 0 && txt && !BLANK.test(txt)) rowLabel = txt;
      let rl = /^(인원\(명\)|건수\(3개 학년도 합계\))$/.test(rowLabel) ? '' : rowLabel;
      if (!rowLabel && rows.length - head > 1) rl = (ri - head + 1) + '행';
      const k = key(id, rl === txt ? '' : rl, col.replace(/\(.*?\)/g, '').trim() || col);
      if (isLk) {
        if (ci < 2) { cell.textContent = txt; if (ci === 1) cell.className = 'l'; }
        else { const r2 = el('input'); r2.type = 'radio'; r2.name = key(id, r[0]); r2.value = S.likert[ci - 2]; cell.appendChild(r2); }
      } else if (isMx && ci >= r.length - S.mx.length) {
        const [name, kind, mo] = S.mx[ci - (r.length - S.mx.length)];
        const nk = key('Ⅱ', rowLabel, name.split('(')[0]);
        if (kind === 'check') {
          const nm = nk;
          mo.forEach((o, i) => { const l = el('label', 'ck'); const cb = el('input'); cb.type = 'checkbox'; cb.name = nm; cb.value = o; l.appendChild(cb); l.appendChild(document.createTextNode(' ' + o)); cell.appendChild(l); });
          cell.dataset.group = nm; cell.dataset.type = 'check';
        } else {
          const s = el('select', 'bl'); s.dataset.k = nk; s.appendChild(new Option('— 선택 —', ''));
          const st = mo[0] === '해당 없음' ? 0 : 1;
          mo.forEach((o, i) => s.appendChild(new Option(CIRC[i + st] + ' ' + (o.startsWith('증빙(') ? '증빙 학생 별도 주기' : o), o)));
          cell.appendChild(s);
        }
      } else if (txt === '' || BLANK.test(txt)) {
        if (col.indexOf('번호') >= 0 && opts.length) cell.appendChild(select(k, opts));
        else if (col.indexOf('예·아니오') >= 0) cell.appendChild(select(k, ['예', '아니오']));
        else if (/부서명|직위|기준일|업무 영역|기관명|명칭|복수/.test(col)) { const i2 = el('input', 'bl wide'); i2.type = 'text'; i2.dataset.k = k; cell.appendChild(i2); }
        else {
          const um = txt.match(/\(\s+\)\s*([가-힣]+)/);
          const unit = um ? um[1] : ((q.text.match(/단위: ([가-힣]+)/) || [])[1] || (/\(명\)/.test(col) || /\(명\)/.test(rowLabel) ? '명' : ''));
          const i2 = el('input', 'bl'); i2.type = 'number'; i2.min = 0; i2.step = 'any'; i2.inputMode = 'decimal';
          i2.dataset.k = k + (unit ? '(' + unit + ')' : '');
          cell.appendChild(i2);
          if (um) cell.appendChild(document.createTextNode(' ' + um[1]));
        }
      } else { cell.textContent = txt; if (txt.length > 14) cell.className = 'l'; }
      tr.appendChild(cell);
    });
    t.appendChild(tr);
  });
  return w;
}

// ── 그리기 ──
P.appendChild(el('h1', '', S.title));
const g = el('div', 'box greet');
S.greeting.forEach(x => g.appendChild(el('p', '', x)));
const sg = el('div', 'sign'); S.sign.forEach(x => sg.appendChild(el('div', '', x))); g.appendChild(sg);
P.appendChild(g);
const gd = el('div', 'box guide'); gd.appendChild(el('div', '', '※ 작성 안내'));
S.guide.filter(x => !/^문의처/.test(x)).forEach(x => gd.appendChild(el('div', '', '○ ' + x)));
gd.appendChild(el('div', '', '○ 입력 내용은 이 컴퓨터에 자동으로 임시 저장됩니다. 끝까지 작성한 뒤 맨 아래 「최종 제출」을 눌러 주십시오(학교당 한 번).'));
S.guide.filter(x => /^문의처/.test(x)).forEach(x => gd.appendChild(el('div', '', '○ ' + x)));   // 문의처는 맨 아래
P.appendChild(gd);
S.items.forEach(it => {
  if (it.t === 'H') { P.appendChild(el('div', 'band', it.text)); SEC = it.text === '기본정보' ? '' : it.text.split('.')[0]; if (it.text === '기본정보') SEC = '기본정보'; return; }
  if (it.t === 'NOTE') {
    let tx = it.text;
    if (tx.indexOf('자기 기관 기준으로 답합니다') >= 0)
      tx = '※ 귀 기관 기준으로, 관리대상 유형마다 표의 칸에서 골라 주십시오. 직접 하지 않는 업무는 「⓪ 해당 없음」을 고릅니다.' + (tx.indexOf('고교 행') >= 0 ? ' 고교 행은 「초·중등교육법 시행령」 제92조의2에 따른 대상이며, 해당 기관만 답합니다.' : '');
    P.appendChild(el('div', 'note', tx)); return;
  }
  const node = renderQ(it); if (node) P.appendChild(node);
});
const bar = el('div', 'bar'); const btn = el('button', '', '최종 제출'); const sv = el('span', 'saved', ''); bar.appendChild(btn); bar.appendChild(sv); P.appendChild(bar);

// ── 모으기·임시 저장·제출 ──
function collect() {
  const out = [], seen = new Set();
  const used = {};
  const push = (k, v) => { used[k] = (used[k] || 0) + 1; out.push([used[k] > 1 ? k + ' (' + used[k] + ')' : k, v]); };
  P.querySelectorAll('input, select, textarea').forEach(e => {
    const skipped = !!e.closest('.q.off');               // 건너뛴 문항은 빈 값
    if (e.type === 'radio' || e.type === 'checkbox') {
      const n = e.name; if (!n || seen.has(n)) return; seen.add(n);
      const vs = [...P.querySelectorAll('input[name="' + CSS.escape(n) + '"]:checked')].map(x => x.value);
      push(n, skipped ? '' : vs.join(', '));
    } else if (e.dataset.k) { push(e.dataset.k, skipped ? '' : e.value.trim()); }
  });
  return out;
}
const LS = 'chwihak-survey-' + S.t;
function save() { try { localStorage.setItem(LS, JSON.stringify(collect())); sv.textContent = '임시 저장됨 ' + new Date().toLocaleTimeString('ko-KR'); } catch (e) {} }
function restore() {
  let data; try { data = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { data = null; }
  if (!data) return;
  const m = new Map(data);
  P.querySelectorAll('input, select, textarea').forEach(e => {
    if (e.type === 'radio' || e.type === 'checkbox') { const v = m.get(e.name); if (v) e.checked = v.split(', ').includes(e.value); }
    else if (e.dataset.k && m.has(e.dataset.k)) e.value = m.get(e.dataset.k);
  });
  P.querySelectorAll('input[type=radio]:checked').forEach(e => e.dispatchEvent(new Event('change', {bubbles:true})));
  AFTER_RESTORE.forEach(f => f());
  sv.textContent = '이전에 작성하던 내용을 불러왔습니다.';
}
restore(); AFTER_RESTORE.forEach(f => f());
let tmr; P.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(save, 800); });
P.addEventListener('change', () => { clearTimeout(tmr); tmr = setTimeout(save, 300); });

btn.addEventListener('click', () => {
  const data = collect();
  const m = new Map(data);
  const need = ['기본정보-1', '기본정보-2 교육청', '기본정보-2 교육지원청', '기본정보-2 학교'].concat(m.get('기본정보-2 학교') === '목록에 없음' ? ['기본정보-2 학교 직접 입력'] : []);
  if (!need.every(k => m.get(k))) { alert('기본정보(학교급·소속·학교)를 먼저 골라 주십시오.'); window.scrollTo(0, 0); return; }
  const empty = data.filter(p => !p[1]).length;
  if (!confirm((empty ? '비어 있는 칸이 ' + empty + '개 있습니다. 해당 없으면 비워 두셔도 됩니다.\n' : '') + '제출하시겠습니까?')) return;
  btn.disabled = true; btn.textContent = '제출 중…';
  google.script.run
    .withSuccessHandler(rc => {
      if (!rc) { btn.disabled = false; btn.textContent = '최종 제출'; alert('저장이 확인되지 않았습니다. 다시 눌러 주십시오.'); return; }
      try { localStorage.setItem(LS + '-sent', JSON.stringify({rc: rc, data: data})); localStorage.removeItem(LS); } catch (e) {}
      P.innerHTML = ''; const dn = el('div', 'done', '제출되었습니다. 조사에 참여해 주셔서 감사합니다.');
      dn.appendChild(el('div', 'saved', '접수번호 ' + rc + ' (문의하실 때 알려 주십시오)'));
      P.appendChild(dn); window.scrollTo(0, 0); })
    .withFailureHandler(err => { btn.disabled = false; btn.textContent = '최종 제출'; alert('제출하지 못했습니다. 잠시 후 다시 눌러 주십시오.\n' + err.message); })
    .submit(S.t, data);
});
